services:
  web:
    image: blog-app
    build: .
    command: sh -c "rm -rf /var/www/shared-public/* && cp -r public/. /var/www/shared-public/ && exec php-fpm"
    volumes:
      - app-public:/var/www/shared-public
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: blog-mysql
      DB_PORT: "3306"
      DB_DATABASE: blog
      DB_USERNAME: blog
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      - blog-mysql
    restart: unless-stopped

  blog-nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  blog-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - blog-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  blog-mysql-data:
  app-public: