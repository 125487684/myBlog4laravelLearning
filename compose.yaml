services:
  web:
    image: blog-app
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: blog-mysql
      DB_PORT: "3306"
      DB_DATABASE: blog
      DB_USERNAME: blog
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      PHP_CLI_SERVER_WORKERS: 8
    depends_on:
      - blog-mysql
    restart: unless-stopped

  blog-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - blog-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  blog-mysql-data: